name: Build x86

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x86
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Verify compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          where.exe cl

          if ($LASTEXITCODE -ne 0) {
            throw "MSVC compiler was not found."
          }

          cl 2>&1 | Select-Object -First 5

      - name: Install Qt 5.15.2 x86
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win32_msvc2019
          modules: ''
          tools: ''
          aqtversion: '==3.3.0'
          py7zrversion: '==1.1.2'
          extra: '--external 7z'

      - name: Verify Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:QT_ROOT_DIR)) {
            throw "QT_ROOT_DIR is empty."
          }

          Write-Host "Qt: $env:QT_ROOT_DIR"

          $qmake = Join-Path $env:QT_ROOT_DIR 'bin\qmake.exe'

          if (!(Test-Path -LiteralPath $qmake)) {
            throw "qmake.exe was not found."
          }

          & $qmake -query QT_VERSION

          if ($LASTEXITCODE -ne 0) {
            throw "qmake failed."
          }

      - name: Install aqt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m pip install `
            --disable-pip-version-check `
            --no-input `
            "aqtinstall==3.3.0"

          if ($LASTEXITCODE -ne 0) {
            throw "aqtinstall installation failed."
          }

      - name: Install Qt OpenSSL x86
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $qtRoot = $env:QT_ROOT_DIR

          $archiveBase = 'https://master.qt.io/online/qtsdkrepository'

          $archiveName = '1.1.1-22openssl_1.1.1v_prebuild_x86.7z'

          $archiveUrl = (
            "$archiveBase/" +
            "windows_x86/desktop/" +
            "tools_openssl_x86/" +
            "qt.tools.openssl.win_x86/" +
            "$archiveName"
          )

          $archivePath = Join-Path `
            $env:RUNNER_TEMP `
            $archiveName

          Write-Host "Checking archived Qt OpenSSL metadata..."

          $installed = $false

          try {
            python -m aqt list-tool `
              windows `
              desktop `
              tools_openssl_x86 `
              --base $archiveBase

            if ($LASTEXITCODE -eq 0) {
              Write-Host "Archived metadata is available."

              python -m aqt install-tool `
                --outputdir "$qtRoot" `
                --base $archiveBase `
                --external 7z `
                windows `
                desktop `
                tools_openssl_x86 `
                qt.tools.openssl.win_x86

              if ($LASTEXITCODE -eq 0) {
                $installed = $true
              }
            }
          }
          catch {
            Write-Warning "aqt archived installation failed: $($_.Exception.Message)"
          }

          if (!$installed) {
            Write-Host "Trying historical Qt OpenSSL archive..."

            try {
              Invoke-WebRequest `
                -Uri $archiveUrl `
                -OutFile $archivePath `
                -UseBasicParsing

              if (!(Test-Path -LiteralPath $archivePath)) {
                throw "Archive was not downloaded."
              }

              $size = (Get-Item -LiteralPath $archivePath).Length

              if ($size -lt 1000000) {
                throw "Downloaded archive is suspiciously small: $size bytes."
              }

              7z x `
                $archivePath `
                "-o$qtRoot" `
                -y

              if ($LASTEXITCODE -ne 0) {
                throw "7-Zip extraction failed."
              }

              $installed = $true
            }
            catch {
              throw @"
Could not install Qt OpenSSL x86.

aqt installation failed and the historical Qt archive
could not be downloaded/extracted.

Archive:
$archiveName

URL:
$archiveUrl

Error:
$($_.Exception.Message)
"@
            }
          }

          Write-Host "OpenSSL installation completed."

      - name: Locate OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $crypto = Get-ChildItem `
            -Path $env:QT_ROOT_DIR `
            -Recurse `
            -Filter 'libcrypto-1_1.dll' `
            -File |
            Select-Object -First 1

          $ssl = Get-ChildItem `
            -Path $env:QT_ROOT_DIR `
            -Recurse `
            -Filter 'libssl-1_1.dll' `
            -File |
            Select-Object -First 1

          if ($null -eq $crypto) {
            throw "libcrypto-1_1.dll was not found."
          }

          if ($null -eq $ssl) {
            throw "libssl-1_1.dll was not found."
          }

          Write-Host "Crypto: $($crypto.FullName)"
          Write-Host "SSL:    $($ssl.FullName)"

          "OPENSSL_CRYPTO=$($crypto.FullName)" >> $env:GITHUB_ENV
          "OPENSSL_SSL=$($ssl.FullName)" >> $env:GITHUB_ENV

      - name: Verify OpenSSL is x86
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-PeMachine([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)

            if ($bytes.Length -lt 64) {
              throw "$Path is too small."
            }

            if (
              $bytes[0] -ne 0x4D -or
              $bytes[1] -ne 0x5A
            ) {
              throw "$Path is not a PE file."
            }

            $offset = [BitConverter]::ToInt32(
              $bytes,
              0x3C
            )

            if (
              $offset -lt 0 -or
              $offset + 6 -gt $bytes.Length
            ) {
              throw "$Path has an invalid PE offset."
            }

            if (
              $bytes[$offset] -ne 0x50 -or
              $bytes[$offset + 1] -ne 0x45 -or
              $bytes[$offset + 2] -ne 0x00 -or
              $bytes[$offset + 3] -ne 0x00
            ) {
              throw "$Path has no PE signature."
            }

            return [BitConverter]::ToUInt16(
              $bytes,
              $offset + 4
            )
          }

          foreach ($dll in @(
            $env:OPENSSL_CRYPTO,
            $env:OPENSSL_SSL
          )) {
            $machine = Get-PeMachine $dll

            Write-Host "$dll -> 0x$($machine.ToString('X4'))"

            if ($machine -ne 0x014C) {
              throw "$dll is not x86."
            }
          }

          Write-Host "OpenSSL is confirmed x86."

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $install = Join-Path `
            $env:GITHUB_WORKSPACE `
            'install'

          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            "-DCMAKE_INSTALL_PREFIX=$install" `
            -DLauncher_BUILD_PLATFORM=official `
            -DLauncher_QT_VERSION_MAJOR=5 `
            -DLauncher_FORCE_BUNDLED_LIBS=ON `
            -DENABLE_LTO=OFF `
            -DDEBUG_ADDRESS_SANITIZER=OFF `
            -DBUILD_TESTING=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake `
            --build build `
            --config Release `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed."
          }

      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake `
            --install build `
            --config Release

          if ($LASTEXITCODE -ne 0) {
            throw "Install failed."
          }

      - name: Copy OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $install = Join-Path `
            $env:GITHUB_WORKSPACE `
            'install'

          Copy-Item `
            -LiteralPath $env:OPENSSL_CRYPTO `
            -Destination (Join-Path $install 'libcrypto-1_1.dll') `
            -Force

          Copy-Item `
            -LiteralPath $env:OPENSSL_SSL `
            -Destination (Join-Path $install 'libssl-1_1.dll') `
            -Force

      - name: Verify final package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $install = Join-Path `
            $env:GITHUB_WORKSPACE `
            'install'

          $required = @(
            'prismlauncher.exe',
            'prismlauncher_filelink.exe',
            'libcrypto-1_1.dll',
            'libssl-1_1.dll',
            'jars\NewLaunch.jar'
          )

          foreach ($file in $required) {
            $path = Join-Path $install $file

            if (!(Test-Path -LiteralPath $path)) {
              throw "Missing: $file"
            }

            Write-Host "OK: $file"
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Compress-Archive `
            -Path 'install\*' `
            -DestinationPath 'PrismLauncher-Windows-x86.zip' `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-Windows-x86
          path: PrismLauncher-Windows-x86.zip
          if-no-files-found: error
