name: Build x86

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x86
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022
          arch: amd64_x86

      - name: Verify MSVC x86
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue

          if ($null -eq $cl) {
            throw "MSVC compiler was not found."
          }

          Write-Host "Compiler: $($cl.Source)"

          cl 2>&1 | Select-Object -First 5

      - name: Install Qt 5.15.2 x86
        uses: jurplel/install-qt-action@v3
        with:
          aqtversion: '==3.1.*'
          py7zrversion: '>=0.20.2'
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win32_msvc2019
          modules: ''
          tools: 'tools_openssl_x86'
          cache: false

      - name: Verify Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:QT_ROOT_DIR)) {
            throw "QT_ROOT_DIR is empty."
          }

          Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"

          $qmake = Join-Path $env:QT_ROOT_DIR 'bin\qmake.exe'

          if (!(Test-Path -LiteralPath $qmake)) {
            throw "qmake.exe was not found at $qmake"
          }

          & $qmake -query QT_VERSION

          if ($LASTEXITCODE -ne 0) {
            throw "qmake failed."
          }

      - name: Verify Qt OpenSSL x86
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $opensslDir = Join-Path $env:QT_ROOT_DIR '..\..\Tools\OpenSSL\Win_x86\bin'

          $crypto = Join-Path $opensslDir 'libcrypto-1_1.dll'
          $ssl = Join-Path $opensslDir 'libssl-1_1.dll'

          if (!(Test-Path -LiteralPath $crypto)) {
            throw "Missing $crypto"
          }

          if (!(Test-Path -LiteralPath $ssl)) {
            throw "Missing $ssl"
          }

          Write-Host "OpenSSL crypto: $crypto"
          Write-Host "OpenSSL SSL:    $ssl"

          "OPENSSL_CRYPTO=$crypto" >> $env:GITHUB_ENV
          "OPENSSL_SSL=$ssl" >> $env:GITHUB_ENV

      - name: Verify OpenSSL architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-PeMachine([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)

            if ($bytes.Length -lt 64) {
              throw "$Path is too small to be a PE file."
            }

            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "$Path does not have an MZ header."
            }

            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)

            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {
              throw "$Path has an invalid PE header offset."
            }

            if (
              $bytes[$peOffset] -ne 0x50 -or
              $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0x00 -or
              $bytes[$peOffset + 3] -ne 0x00
            ) {
              throw "$Path does not have a PE signature."
            }

            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }

          foreach ($dll in @(
            $env:OPENSSL_CRYPTO,
            $env:OPENSSL_SSL
          )) {
            $machine = Get-PeMachine $dll

            Write-Host "$dll -> 0x$($machine.ToString('X4'))"

            if ($machine -ne 0x014C) {
              throw "$dll is NOT x86."
            }
          }

          Write-Host "Both OpenSSL DLLs are confirmed x86."

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $install = Join-Path $env:GITHUB_WORKSPACE 'install'

          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            "-DCMAKE_INSTALL_PREFIX=$install" `
            -DCMAKE_BUILD_TYPE=Release `
            -DLauncher_BUILD_PLATFORM=official `
            -DLauncher_QT_VERSION_MAJOR=5 `
            -DLauncher_FORCE_BUNDLED_LIBS=ON `
            -DENABLE_LTO=OFF `
            -DDEBUG_ADDRESS_SANITIZER=OFF `
            -DBUILD_TESTING=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake `
            --build build `
            --config Release `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed."
          }

      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake `
            --install build `
            --config Release

          if ($LASTEXITCODE -ne 0) {
            throw "Install failed."
          }

      - name: Copy OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $install = Join-Path $env:GITHUB_WORKSPACE 'install'

          Copy-Item `
            -LiteralPath $env:OPENSSL_CRYPTO `
            -Destination (Join-Path $install 'libcrypto-1_1.dll') `
            -Force

          Copy-Item `
            -LiteralPath $env:OPENSSL_SSL `
            -Destination (Join-Path $install 'libssl-1_1.dll') `
            -Force

      - name: Verify x86 executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Join-Path $env:GITHUB_WORKSPACE 'install\prismlauncher.exe'

          if (!(Test-Path -LiteralPath $exe)) {
            throw "prismlauncher.exe was not produced."
          }

          $bytes = [System.IO.File]::ReadAllBytes($exe)

          if ($bytes.Length -lt 64) {
            throw "prismlauncher.exe is invalid."
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)

          if (
            $bytes[$peOffset] -ne 0x50 -or
            $bytes[$peOffset + 1] -ne 0x45 -or
            $bytes[$peOffset + 2] -ne 0x00 -or
            $bytes[$peOffset + 3] -ne 0x00
          ) {
            throw "prismlauncher.exe has no valid PE signature."
          }

          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

          Write-Host "prismlauncher.exe -> 0x$($machine.ToString('X4'))"

          if ($machine -ne 0x014C) {
            throw "prismlauncher.exe is NOT x86."
          }

          Write-Host "prismlauncher.exe is confirmed x86."

      - name: Verify final package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $install = Join-Path $env:GITHUB_WORKSPACE 'install'

          $required = @(
            'prismlauncher.exe',
            'prismlauncher_filelink.exe',
            'libcrypto-1_1.dll',
            'libssl-1_1.dll',
            'jars\NewLaunch.jar'
          )

          foreach ($file in $required) {
            $path = Join-Path $install $file

            if (!(Test-Path -LiteralPath $path)) {
              throw "Missing required file: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "Final package verification passed."

      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Compress-Archive `
            -Path 'install\*' `
            -DestinationPath 'PrismLauncher-Windows-x86.zip' `
            -Force

          if (!(Test-Path -LiteralPath 'PrismLauncher-Windows-x86.zip')) {
            throw "ZIP was not created."
          }

          Write-Host "Created PrismLauncher-Windows-x86.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-Windows-x86
          path: PrismLauncher-Windows-x86.zip
          if-no-files-found: error
