name: Build x86

on:
  workflow_call:
    inputs:
      build_type:
        description: Type of build
        type: string
        default: Release
      is_qt_cached:
        description: Enable Qt caching
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      build_type:
        description: Type of build
        required: true
        type: choice
        options:
          - Debug
          - Release
          - RelWithDebInfo
          - MinSizeRel
        default: Release

      is_qt_cached:
        description: Enable Qt caching
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Windows MSVC x86
    runs-on: windows-2022

    env:
      BUILD_DIR: build
      INSTALL_DIR: install
      INSTALL_PORTABLE_DIR: install-portable

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify build prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake --version
          java -version
          7z i | Select-Object -First 3

          $vswhere = Join-Path $env:ProgramFiles(x86) 'Microsoft Visual Studio\Installer\vswhere.exe'

          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe was not found."
          }

          $vs = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if ([string]::IsNullOrWhiteSpace($vs)) {
            throw "Visual Studio C++ x86/x64 build tools were not found."
          }

          Write-Host "Visual Studio: $vs"

          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'

          if (!(Test-Path $vcvars)) {
            throw "vcvarsall.bat was not found at $vcvars"
          }

      - name: Set short version
        shell: bash
        run: |
          echo "VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install Qt 5.15.2 x86
        uses: jurplel/install-qt-action@v4.3.1
        with:
          aqtversion: '==3.3.0'
          py7zrversion: '==1.1.2'
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win32_msvc2019
          modules: ''
          tools: ''
          cache: ${{ inputs.is_qt_cached }}
          extra: '--external 7z'

      - name: Verify Qt x86 installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:QT_ROOT_DIR)) {
            throw "QT_ROOT_DIR was not set by install-qt-action."
          }

          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"

          $qtDll = Join-Path `
            $env:QT_ROOT_DIR `
            'bin\Qt5Core.dll'

          $qtCmake = Join-Path `
            $env:QT_ROOT_DIR `
            'lib\cmake\Qt5\Qt5Config.cmake'

          if (!(Test-Path $qtDll)) {
            throw "Qt5Core.dll is missing: $qtDll"
          }

          if (!(Test-Path $qtCmake)) {
            throw "Qt5Config.cmake is missing: $qtCmake"
          }

      - name: Locate Qt Tools directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:QT_ROOT_DIR)) {
            throw "QT_ROOT_DIR is not set."
          }

          # QT_ROOT_DIR:
          #   ...\Qt\5.15.2\msvc2019
          #
          # We want:
          #   ...\Qt\Tools

          $qtVersionDir = Split-Path -Parent $env:QT_ROOT_DIR
          $qtDir = Split-Path -Parent $qtVersionDir
          $qtTools = Join-Path $qtDir 'Tools'

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $qtTools | Out-Null

          Write-Host "Qt Tools directory: $qtTools"

          "QT_TOOLS_DIR=$qtTools" >> $env:GITHUB_ENV

      - name: Install Qt-compatible OpenSSL 1.1 x86
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:QT_TOOLS_DIR)) {
            throw "QT_TOOLS_DIR was not set."
          }

          $url = `
            'https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/tools_openssl_x86/qt.tools.openssl.win_x86/1.1.1-22openssl_1.1.1v_prebuild_x86.7z'

          $archive = `
            Join-Path $env:RUNNER_TEMP 'openssl-x86.7z'

          Write-Host "Downloading Qt x86 OpenSSL package..."
          Write-Host $url

          Invoke-WebRequest `
            -UseBasicParsing `
            -Uri $url `
            -OutFile $archive

          if (!(Test-Path $archive)) {
            throw "OpenSSL archive was not downloaded."
          }

          Write-Host "Extracting OpenSSL package..."

          & 7z x `
            $archive `
            "-o$env:QT_TOOLS_DIR" `
            -y

          if ($LASTEXITCODE -ne 0) {
            throw `
              "7-Zip failed to extract OpenSSL. Exit code: $LASTEXITCODE"
          }

          $crypto = Get-ChildItem `
            -Path $env:QT_TOOLS_DIR `
            -Recurse `
            -Filter 'libcrypto-1_1.dll' `
            -File |
            Select-Object -First 1

          $ssl = Get-ChildItem `
            -Path $env:QT_TOOLS_DIR `
            -Recurse `
            -Filter 'libssl-1_1.dll' `
            -File |
            Select-Object -First 1

          if ($null -eq $crypto) {
            throw `
              "OpenSSL package did not contain libcrypto-1_1.dll."
          }

          if ($null -eq $ssl) {
            throw `
              "OpenSSL package did not contain libssl-1_1.dll."
          }

          Write-Host "OpenSSL crypto:"
          Write-Host $crypto.FullName

          Write-Host "OpenSSL SSL:"
          Write-Host $ssl.FullName

          "OPENSSL_X86_CRYPTO=$($crypto.FullName)" `
            >> $env:GITHUB_ENV

          "OPENSSL_X86_SSL=$($ssl.FullName)" `
            >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue `
            $env:BUILD_DIR

          cmake `
            -S . `
            -B $env:BUILD_DIR `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\$env:INSTALL_DIR" `
            -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" `
            -DLauncher_BUILD_PLATFORM=official `
            -DLauncher_QT_VERSION_MAJOR=5 `
            -DLauncher_FORCE_BUNDLED_LIBS=ON `
            -DENABLE_LTO=OFF `
            -DDEBUG_ADDRESS_SANITIZER=OFF `
            -DBUILD_TESTING=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake `
            --build $env:BUILD_DIR `
            --config "${{ inputs.build_type }}" `
            --parallel 2

      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue `
            $env:INSTALL_DIR

          cmake `
            --install $env:BUILD_DIR `
            --config "${{ inputs.build_type }}"

      - name: Add x86 OpenSSL DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:OPENSSL_X86_CRYPTO)) {
            throw "OpenSSL crypto path was not recorded."
          }

          if ([string]::IsNullOrWhiteSpace($env:OPENSSL_X86_SSL)) {
            throw "OpenSSL SSL path was not recorded."
          }

          Copy-Item `
            $env:OPENSSL_X86_CRYPTO `
            "$env:GITHUB_WORKSPACE\$env:INSTALL_DIR\libcrypto-1_1.dll" `
            -Force

          Copy-Item `
            $env:OPENSSL_X86_SSL `
            "$env:GITHUB_WORKSPACE\$env:INSTALL_DIR\libssl-1_1.dll" `
            -Force

      - name: Verify outputs and PE architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-PeMachine([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)

            if (
              $bytes.Length -lt 64 -or
              $bytes[0] -ne 0x4D -or
              $bytes[1] -ne 0x5A
            ) {
              throw "$Path is not a PE file."
            }

            $peOffset = `
              [BitConverter]::ToInt32($bytes, 0x3C)

            if (
              $peOffset -lt 0 -or
              $peOffset + 6 -gt $bytes.Length
            ) {
              throw "$Path has an invalid PE header."
            }

            if (
              $bytes[$peOffset] -ne 0x50 -or
              $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0 -or
              $bytes[$peOffset + 3] -ne 0
            ) {
              throw "$Path is missing the PE signature."
            }

            return [BitConverter]::ToUInt16(
              $bytes,
              $peOffset + 4
            )
          }

          $required = @(
            "$env:GITHUB_WORKSPACE\$env:INSTALL_DIR\prismlauncher.exe",
            "$env:GITHUB_WORKSPACE\$env:INSTALL_DIR\prismlauncher_filelink.exe",
            "$env:GITHUB_WORKSPACE\$env:INSTALL_DIR\libcrypto-1_1.dll",
            "$env:GITHUB_WORKSPACE\$env:INSTALL_DIR\libssl-1_1.dll",
            "$env:GITHUB_WORKSPACE\$env:INSTALL_DIR\jars\NewLaunch.jar"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing required output: $file"
            }
          }

          $peFiles = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\$env:INSTALL_DIR" `
            -Recurse `
            -File `
            -Include *.exe,*.dll

          foreach ($file in $peFiles) {
            $machine = Get-PeMachine $file.FullName

            Write-Host `
              "$($file.FullName) -> PE machine 0x$($machine.ToString('X4'))"

            if ($machine -ne 0x014C) {
              throw `
                "$($file.FullName) is not x86. Expected IMAGE_FILE_MACHINE_I386 (0x014C)."
            }
          }

      - name: Create portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue `
            $env:INSTALL_PORTABLE_DIR

          Copy-Item `
            $env:INSTALL_DIR `
            $env:INSTALL_PORTABLE_DIR `
            -Recurse

          cmake `
            --install $env:BUILD_DIR `
            --config "${{ inputs.build_type }}" `
            --prefix "$env:GITHUB_WORKSPACE\$env:INSTALL_PORTABLE_DIR" `
            --component portable

      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = `
            "PrismLauncher-7.2-Windows-x86-$env:VERSION.zip"

          Compress-Archive `
            -Path "$env:INSTALL_PORTABLE_DIR\*" `
            -DestinationPath $zip `
            -Force

          if (!(Test-Path $zip)) {
            throw "Portable ZIP was not created."
          }

      - name: Upload x86 portable build
        uses: actions/upload-artifact@v6
        with:
          name: PrismLauncher-7.2-Windows-x86-${{ env.VERSION }}
          path: PrismLauncher-7.2-Windows-x86-${{ env.VERSION }}.zip
          if-no-files-found: error
