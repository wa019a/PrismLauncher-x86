name: Build x86

on:
  workflow_call:
    inputs:
      build_type:
        description: Type of build
        type: string
        default: Release
      is_qt_cached:
        description: Enable Qt caching
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      build_type:
        description: Type of build
        required: true
        type: choice
        options:
          - Debug
          - Release
          - RelWithDebInfo
          - MinSizeRel
        default: Release

      is_qt_cached:
        description: Enable Qt caching or not
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Windows MSVC x86
    runs-on: windows-2022

    env:
      BUILD_DIR: build
      INSTALL_DIR: install
      INSTALL_PORTABLE_DIR: install-portable

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set short version
        shell: bash
        run: |
          echo "VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install Qt 5.15.2 x86
        uses: jurplel/install-qt-action@v4.3.1
        with:
          aqtversion: '==3.3.*'
          py7zrversion: '==1.1.*'
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win32_msvc2019
          modules: ''
          tools: 'tools_openssl_x86'
          cache: ${{ inputs.is_qt_cached }}

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue `
            $env:BUILD_DIR

          cmake `
            -S . `
            -B $env:BUILD_DIR `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\$env:INSTALL_DIR" `
            -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" `
            -DLauncher_BUILD_PLATFORM=official `
            -DLauncher_QT_VERSION_MAJOR=5 `
            -DLauncher_FORCE_BUNDLED_LIBS=ON `
            -DENABLE_LTO=OFF `
            -DBUILD_TESTING=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake `
            --build $env:BUILD_DIR `
            --config "${{ inputs.build_type }}" `
            --parallel 2

      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue `
            $env:INSTALL_DIR

          cmake `
            --install $env:BUILD_DIR `
            --config "${{ inputs.build_type }}"

      - name: Add x86 OpenSSL 1.1 DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $qtTools = $env:IQTA_TOOLS

          if ([string]::IsNullOrWhiteSpace($qtTools) -or !(Test-Path $qtTools)) {
            throw "IQTA_TOOLS was not set by install-qt-action."
          }

          $crypto = Get-ChildItem `
            -Path $qtTools `
            -Recurse `
            -Filter 'libcrypto-1_1.dll' `
            -File |
            Select-Object -First 1

          $ssl = Get-ChildItem `
            -Path $qtTools `
            -Recurse `
            -Filter 'libssl-1_1.dll' `
            -File |
            Select-Object -First 1

          if ($null -eq $crypto) {
            throw "Could not find x86 libcrypto-1_1.dll."
          }

          if ($null -eq $ssl) {
            throw "Could not find x86 libssl-1_1.dll."
          }

          Copy-Item `
            $crypto.FullName `
            "$env:GITHUB_WORKSPACE\$env:INSTALL_DIR\libcrypto-1_1.dll" `
            -Force

          Copy-Item `
            $ssl.FullName `
            "$env:GITHUB_WORKSPACE\$env:INSTALL_DIR\libssl-1_1.dll" `
            -Force

          Write-Host "Using OpenSSL:"
          Write-Host $crypto.FullName
          Write-Host $ssl.FullName

      - name: Verify PE architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-PeMachine([string]$Path) {

            $bytes = [System.IO.File]::ReadAllBytes($Path)

            if (
              $bytes.Length -lt 64 -or
              $bytes[0] -ne 0x4D -or
              $bytes[1] -ne 0x5A
            ) {
              throw "$Path is not a PE file."
            }

            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)

            if (
              $peOffset -lt 0 -or
              $peOffset + 6 -gt $bytes.Length
            ) {
              throw "$Path has an invalid PE header."
            }

            if (
              $bytes[$peOffset] -ne 0x50 -or
              $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0x00 -or
              $bytes[$peOffset + 3] -ne 0x00
            ) {
              throw "$Path is missing the PE signature."
            }

            return [BitConverter]::ToUInt16(
              $bytes,
              $peOffset + 4
            )
          }

          $files = @(
            "$env:GITHUB_WORKSPACE\$env:INSTALL_DIR\prismlauncher.exe",
            "$env:GITHUB_WORKSPACE\$env:INSTALL_DIR\libcrypto-1_1.dll",
            "$env:GITHUB_WORKSPACE\$env:INSTALL_DIR\libssl-1_1.dll"
          )

          foreach ($file in $files) {

            if (!(Test-Path $file)) {
              throw "Missing required file: $file"
            }

            $machine = Get-PeMachine $file

            Write-Host `
              "$file -> PE machine 0x$($machine.ToString('X4'))"

            if ($machine -ne 0x014C) {
              throw `
                "$file is not x86. Expected IMAGE_FILE_MACHINE_I386 (0x014C)."
            }
          }

      - name: Create portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue `
            $env:INSTALL_PORTABLE_DIR

          Copy-Item `
            $env:INSTALL_DIR `
            $env:INSTALL_PORTABLE_DIR `
            -Recurse

          cmake `
            --install $env:BUILD_DIR `
            --config "${{ inputs.build_type }}" `
            --prefix "$env:GITHUB_WORKSPACE\$env:INSTALL_PORTABLE_DIR" `
            --component portable

      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = `
            "PrismLauncher-7.2-Windows-x86-$env:VERSION.zip"

          Compress-Archive `
            -Path "$env:INSTALL_PORTABLE_DIR\*" `
            -DestinationPath $zip `
            -Force

      - name: Upload x86 portable build
        uses: actions/upload-artifact@v6
        with:
          name: PrismLauncher-7.2-Windows-x86-${{ env.VERSION }}
          path: PrismLauncher-7.2-Windows-x86-${{ env.VERSION }}.zip
          if-no-files-found: error
