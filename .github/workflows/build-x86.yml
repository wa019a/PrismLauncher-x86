name: Build x86

on:
  workflow_dispatch:

jobs:
  build:
    name: Windows x86
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022
          arch: amd64_x86

      - name: Install Qt 5.15.2 x86
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win32_msvc2019
          modules: qtimageformats
          cache: false

      - name: Show Qt installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"

          if (!(Test-Path "$env:QT_ROOT_DIR\bin\qmake.exe")) {
            throw "Qt installation was not found."
          }

          & "$env:QT_ROOT_DIR\bin\qmake.exe" -query

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\install" `
            -DCMAKE_BUILD_TYPE=Release `
            -DLauncher_BUILD_PLATFORM=official `
            -DLauncher_QT_VERSION_MAJOR=5 `
            -DLauncher_FORCE_BUNDLED_LIBS=ON `
            -DENABLE_LTO=OFF `
            -DBUILD_TESTING=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake --build build --config Release --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed."
          }

      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake --install build --config Release

          if ($LASTEXITCODE -ne 0) {
            throw "Install failed."
          }

      - name: Verify executable architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = "${{ github.workspace }}\install\prismlauncher.exe"

          if (!(Test-Path $exe)) {
            throw "prismlauncher.exe was not produced."
          }

          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)

          Write-Host "PE machine type: 0x$($machine.ToString('X4'))"

          if ($machine -ne 0x014c) {
            throw "The executable is not x86/Win32."
          }

          Write-Host "Confirmed: 32-bit x86 executable."

      - name: Locate OpenSSL DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Searching runner for x86 OpenSSL 1.1 DLLs..."

          $matches = Get-ChildItem `
            -Path "C:\", "D:\" `
            -Filter "libcrypto-1_1.dll" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "OpenSSL|Win_x86|Qt"
            }

          if (!$matches) {
            throw "No libcrypto-1_1.dll matching an x86 Qt/OpenSSL installation was found."
          }

          foreach ($file in $matches) {
            Write-Host $file.FullName
          }

          $crypto = $matches | Select-Object -First 1
          $ssl = Join-Path $crypto.Directory.FullName "libssl-1_1.dll"

          if (!(Test-Path $ssl)) {
            throw "Found libcrypto but not matching libssl: $ssl"
          }

          "OPENSSL_CRYPTO=$($crypto.FullName)" >> $env:GITHUB_ENV
          "OPENSSL_SSL=$ssl" >> $env:GITHUB_ENV

      - name: Copy OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $install = "${{ github.workspace }}\install"

          Copy-Item "$env:OPENSSL_CRYPTO" "$install\libcrypto-1_1.dll" -Force
          Copy-Item "$env:OPENSSL_SSL" "$install\libssl-1_1.dll" -Force

      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Compress-Archive `
            -Path "${{ github.workspace }}\install\*" `
            -DestinationPath "${{ github.workspace }}\PrismLauncher-Windows-x86.zip" `
            -Force

      - name: Upload x86 build
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-Windows-x86
          path: PrismLauncher-Windows-x86.zip
          if-no-files-found: error
